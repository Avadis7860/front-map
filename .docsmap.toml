# .docsmap.toml — carte de doc de ce repo (docs-map, injecté). Valeurs = défauts.
# Sert aussi de repère de racine. Sans lui, docs-map applique les défauts génériques (`docs/**/*.md`).

[sources]
# Racine de la prose markdown à indexer (relative à la racine du repo).
docs = "docs"

# Motif des fichiers sous `docs` (récursif). Markdown seulement (carte de headings).
glob = "**/*.md"

# Markdown SUPPLÉMENTAIRE hors `docs` à inclure : le README racine — la porte d'entrée du repo, hors
# index jusqu'ici, donc invisible à `docsmap where` et jamais relue.
extra = ["README.md"]
